; 数据采集系统 supervisor 托管配置
;
; 安装位置 /opt/data-collect：
;   /opt/data-collect/data-collect        二进制
;   /opt/data-collect/config/server.yaml  启动配置（端口 / 数据目录）
;   /opt/data-collect/config/device.yaml  设备接入目录（串口 / 本地 IO）
;   /opt/data-collect/data/               运行时数据（自动创建）
;
; 说明：device.yaml 必须位于二进制旁边的 config/ 目录（程序固定查找位置）。

[program:data-collect]
directory=/opt/data-collect
command=/opt/data-collect/data-collect

; 自启动与异常拉起
autostart=true
autorestart=true
startsecs=3
startretries=5

; 停止时先 SIGTERM 等优雅退出，再强杀进程组
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true

user=root
umask=022

; 日志（程序自身输出，日志级别由 config/server.yaml 的 log.level 控制）
redirect_stderr=true
stdout_logfile=/var/log/data-collect/data-collect.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/data-collect/data-collect.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

environment=GOLOOK_CONFIG_FILE="/opt/data-collect/config/server.yaml"
